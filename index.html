<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F0E8">
<title>LEVEL//UP</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav id="nav" aria-label="Main">
  <button data-act="tab" data-t="dash">Dashboard</button>
  <button data-act="tab" data-t="dop">Dopamine</button>
  <button data-act="tab" data-t="hab">Habits</button>
  <button data-act="tab" data-t="cals">Calendars</button>
  <button data-act="tab" data-t="quest">Quests</button>
</nav>
<div id="sheet" hidden>
  <div class="back" data-act="close"></div>
  <div class="panel" role="dialog" aria-modal="true" aria-label="Details">
    <button class="x" data-act="close" aria-label="Close">✕</button>
    <div id="sbody"></div>
  </div>
</div>
<div id="flash" data-act="flashx" role="status"></div>
<div id="toast" role="status"></div>
<script src="app.js"></script>
</body>
</html>
